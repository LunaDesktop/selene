name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Zależności systemowe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config build-essential libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxcursor-dev libfontconfig1-dev libfreetype6-dev

      # `output.rs` wkompilowuje tapetę przez
      # `include_bytes!("../../assets/branding/paganlinux.png")`, czyli z katalogu
      # obok repozytorium. W monorepo istnieje, w pojedynczym repo trzeba go dołożyć.
      - name: Branding (tapeta)
        run: |
          git clone --depth 1 https://github.com/LunaDesktop/branding.git "$RUNNER_TEMP/branding"
          mkdir -p "$GITHUB_WORKSPACE/../assets/branding"
          cp "$RUNNER_TEMP/branding/wallpapers/paganlinux.png" "$GITHUB_WORKSPACE/../assets/branding/"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Pakiet
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist
          for bin in selene; do
            cp "target/release/$bin" dist/
          done
          (cd dist && sha256sum * > SHA256SUMS)
          tar -czf "${GITHUB_REPOSITORY#*/}-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" -C dist .

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
          generate_release_notes: true

  distro:
    needs: build
    uses: LunaDesktop/luna/.github/workflows/distro-packages.yml@main
    with:
      package: "selene"
      description: "Selene — kompozytor Wayland środowiska Luna"
      binaries: "selene"
      files: |
        packaging/luna-session:/usr/bin/luna-session:755
        packaging/selene.desktop:/usr/share/wayland-sessions/selene.desktop:644
      branding: true
      deb_depends: "libc6,libxkbcommon0,libxcursor1,libwayland-client0,xkb-data,libluna"
      rpm_depends: "glibc,libxkbcommon,libXcursor,libwayland-client,xkeyboard-config,libluna"
      arch_depends: "glibc,libxkbcommon,libxcursor,wayland,xorg-xkeyboard-config,libluna"
